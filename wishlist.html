<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ain & Mikhail Wedding RSVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nearblack: '#1a0a0a',
                        darksage: '#636656',
                        kwared: '#b12220',
                        deepred: '#93262c',
                        ivory: '#f9f3ea',
                        warmgold: '#c8922a',
                        softgold: '#f3d9a4',
                        silverecho: '#c8c8c8'
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'serif'],
                        sans: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f9f3ea; }
        .double-border { border: 4px double #c8922a; }
        .wishlist-card:hover .wishlist-img { transform: scale(1.05); }
    </style>
</head>
<body class="text-nearblack text-center antialiased">

    <main class="py-12 px-4">
        
        <h1 class="font-serif text-5xl md:text-6xl text-kwared mb-2 mt-8">Ain & Mikhail</h1>
        <p class="font-serif text-xl md:text-2xl text-deepred mb-2 mt-6">Solemnization and Tea Ceremony</p>
        <p class="uppercase tracking-widest text-darksage text-sm font-bold mb-8">Sunday • 5 July 2026</p>

        <!-- COUNTDOWN TIMER -->
        <div class="flex justify-center gap-3 md:gap-6 mb-12 text-nearblack w-full max-w-md mx-auto">
            <div class="bg-ivory double-border p-3 md:p-4 w-20 md:w-24 shadow-sm flex flex-col items-center">
                <div id="cd-days" class="font-serif text-3xl md:text-4xl text-kwared">00</div>
                <div class="text-[9px] md:text-[10px] uppercase tracking-widest text-darksage mt-1 font-bold">Days</div>
            </div>
            <div class="bg-ivory double-border p-3 md:p-4 w-20 md:w-24 shadow-sm flex flex-col items-center">
                <div id="cd-hours" class="font-serif text-3xl md:text-4xl text-kwared">00</div>
                <div class="text-[9px] md:text-[10px] uppercase tracking-widest text-darksage mt-1 font-bold">Hours</div>
            </div>
            <div class="bg-ivory double-border p-3 md:p-4 w-20 md:w-24 shadow-sm flex flex-col items-center">
                <div id="cd-minutes" class="font-serif text-3xl md:text-4xl text-kwared">00</div>
                <div class="text-[9px] md:text-[10px] uppercase tracking-widest text-darksage mt-1 font-bold">Mins</div>
            </div>
            <div class="bg-ivory double-border p-3 md:p-4 w-20 md:w-24 shadow-sm flex flex-col items-center">
                <div id="cd-seconds" class="font-serif text-3xl md:text-4xl text-kwared">00</div>
                <div class="text-[9px] md:text-[10px] uppercase tracking-widest text-darksage mt-1 font-bold">Secs</div>
            </div>
        </div>

        <section class="w-full max-w-2xl mx-auto my-20 px-4 border-t border-warmgold pt-16">
            <div class="text-center mb-12">
                <h2 class="font-serif text-3xl md:text-4xl text-nearblack mb-4">Wedding Wishlist</h2>
                <div class="h-1 w-16 bg-warmgold mx-auto mb-6"></div>
            </div>

            <div class="flex flex-col gap-6">
                <!-- Card 1: Available -->
                <div class="wishlist-card bg-ivory double-border p-4 shadow-sm flex items-center gap-4 w-full text-left">
                    <div class="w-24 h-24 flex-shrink-0 bg-slate-50 overflow-hidden relative border border-warmgold/20">
                        <img src="https://placehold.co/400x400/f9f3ea/636656?text=Hair+Dryer" alt="Gift" class="wishlist-img w-full h-full object-cover transition-transform duration-500">
                    </div>
                    <div class="flex-grow">
                        <div class="flex justify-between items-start">
                            <h3 class="font-serif text-lg font-bold text-nearblack">Philips Hair Dryer</h3>
                            <span class="text-[10px] uppercase tracking-widest px-2 py-0.5 bg-green-500/10 text-green-700 font-bold border border-green-500/20">Available</span>
                        </div>
                        <p class="text-xs text-darksage mb-3">EssentialCare Compact BHC010/13</p>
                        <div class="flex gap-2">
                            <a href="#" class="inline-block bg-warmgold text-white uppercase tracking-widest text-[9px] py-1.5 px-3 hover:bg-nearblack transition-colors duration-300 font-bold">Shopee</a>
                            <a href="https://wa.me/yournumber" class="inline-block bg-darksage text-white uppercase tracking-widest text-[9px] py-1.5 px-3 hover:bg-nearblack transition-colors duration-300 font-bold">
                                <i class="fab fa-whatsapp"></i> Admin
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Card 2: Reserved -->
                <div class="wishlist-card bg-ivory double-border p-4 shadow-sm flex items-center gap-4 w-full text-left">
                    <div class="w-24 h-24 flex-shrink-0 bg-slate-50 overflow-hidden relative border border-warmgold/20">
                        <img src="https://placehold.co/400x400/f9f3ea/636656?text=Air+Fryer" alt="Gift" class="wishlist-img w-full h-full object-cover transition-transform duration-500">
                    </div>
                    <div class="flex-grow">
                        <div class="flex justify-between items-start">
                            <h3 class="font-serif text-lg font-bold text-nearblack">Xiaomi Air Fryer</h3>
                            <span class="text-[10px] uppercase tracking-widest px-2 py-0.5 bg-gray-300/50 text-gray-600 font-bold border border-gray-400/20">Reserved</span>
                        </div>
                        <p class="text-xs text-darksage mb-3">4L Capacity, White</p>
                        <div class="flex gap-2">
                            <a href="#" class="inline-block bg-warmgold text-white uppercase tracking-widest text-[9px] py-1.5 px-3 hover:bg-nearblack transition-colors duration-300 font-bold">Shopee</a>
                            <a href="https://wa.me/yournumber" class="inline-block bg-darksage text-white uppercase tracking-widest text-[9px] py-1.5 px-3 hover:bg-nearblack transition-colors duration-300 font-bold">
                                <i class="fab fa-whatsapp"></i> Admin
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-nearblack text-ivory py-10 text-center">
        <h2 class="font-serif text-3xl mb-4 text-softgold">M & A</h2>
    </footer>

    <script>
        const countDownDate = new Date("July 5, 2026 08:00:00 GMT+0800").getTime();
        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("cd-days").innerHTML = days < 10 ? '0' + days : days;
            document.getElementById("cd-hours").innerHTML = hours < 10 ? '0' + hours : hours;
            document.getElementById("cd-minutes").innerHTML = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById("cd-seconds").innerHTML = seconds < 10 ? '0' + seconds : seconds;
        }, 1000);
    </script>
</body>
</html>
